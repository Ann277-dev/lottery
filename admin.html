<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 抽奖管理后台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f5f5;padding:16px;max-width:800px;margin:0 auto}
h1{text-align:center;margin:16px 0;color:#333;font-size:22px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px}
.card{background:#fff;border-radius:14px;padding:16px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.card .num{font-size:36px;font-weight:800;color:#7c5cfc}
.card .label{font-size:12px;color:#888;margin-top:2px}
.chart{background:#fff;border-radius:14px;padding:16px;margin-bottom:16px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.chart h3{margin-bottom:12px;color:#444;font-size:15px}
.bar{margin-bottom:8px;display:flex;align-items:center;gap:8px}
.bar .name{width:110px;text-align:right;font-size:13px;flex-shrink:0}
.bar .track{flex:1;height:24px;background:#f0f0f0;border-radius:12px;overflow:hidden}
.bar .fill{height:100%;border-radius:12px;background:linear-gradient(90deg,#7c5cfc,#a18cd1);display:flex;align-items:center;justify-content:flex-end;padding-right:8px;font-size:11px;color:#fff;font-weight:600;min-width:35px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
th,td{padding:8px 10px;text-align:left;font-size:12px}
th{background:#7c5cfc;color:#fff;font-weight:600}
td{border-bottom:1px solid #f0f0f0}
.picked-badge{background:#fff3cd;color:#b8860b;padding:1px 6px;border-radius:8px;font-size:11px}
.loading{text-align:center;padding:40px;color:#888}
.error{text-align:center;padding:40px;color:red}
.refresh{text-align:center;margin:16px 0}
.refresh button{padding:10px 28px;border-radius:20px;border:none;background:#7c5cfc;color:#fff;font-size:14px;cursor:pointer;font-family:inherit}
.refresh span{color:#888;font-size:11px;margin-left:8px}
</style>
</head>
<body>
<h1>📊 抽奖管理后台</h1>
<div class="loading" id="loading">加载中...</div>
<div id="content" style="display:none"></div>
<div class="refresh">
  <button onclick="loadData()">🔄 刷新数据</button>
  <span id="updateTime"></span>
</div>

<script>
const DATA_URL = 'https://raw.githubusercontent.com/Ann277-dev/lottery-data/main/data.json';

async function loadData() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('content').style.display = 'none';
  try {
    const res = await fetch(DATA_URL + '?t=' + Date.now());
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    render(data);
    document.getElementById('updateTime').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
  } catch(e) {
    document.getElementById('loading').innerHTML = '<span style="color:red">加载失败：' + e.message + '</span>';
  }
}

function render(data) {
  const records = data.records || [];
  const total = records.length;
  const today = new Date().toISOString().slice(0,10);
  const todayRecords = records.filter(r => r.time && r.time.startsWith(today));

  const prizeCount = {};
  const pickCount = {};
  records.forEach(r => {
    if (r.results) r.results.forEach(p => { prizeCount[p.name] = (prizeCount[p.name]||0)+1; });
    if (r.picked) pickCount[r.picked.name] = (pickCount[r.picked.name]||0)+1;
  });

  const recent = records.slice(-20).reverse();
  const maxPrize = Math.max(...Object.values(prizeCount), 1);
  const maxPick = Math.max(...Object.values(pickCount), 1);

  document.getElementById('content').innerHTML = `
    <div class="cards">
      <div class="card"><div class="num">${total}</div><div class="label">👥 参与人数</div></div>
      <div class="card"><div class="num">${todayRecords.length}</div><div class="label">📅 今日</div></div>
      <div class="card"><div class="num">${total*3}</div><div class="label">🎰 总抽奖次数</div></div>
      <div class="card"><div class="num">${Object.values(pickCount).reduce((a,b)=>a+b,0)}</div><div class="label">✅ 已领取</div></div>
    </div>
    <div class="chart">
      <h3>🎰 抽中奖品分布（${total*3} 次）</h3>
      ${Object.entries(prizeCount).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`
        <div class="bar"><span class="name">${n}</span><div class="track"><div class="fill" style="width:${Math.max(Math.round(c/maxPrize*100),3)}%">${c}</div></div></div>
      `).join('') || '<p style="color:#aaa;text-align:center">暂无数据</p>'}
    </div>
    <div class="chart">
      <h3>✅ 选择领取分布</h3>
      ${Object.entries(pickCount).sort((a,b)=>b[1]-a[1]).map(([n,c])=>`
        <div class="bar"><span class="name">${n}</span><div class="track"><div class="fill" style="width:${Math.max(Math.round(c/maxPick*100),3)}%">${c}</div></div></div>
      `).join('') || '<p style="color:#aaa;text-align:center">暂无数据</p>'}
    </div>
    <div class="chart">
      <h3>📜 最近记录</h3>
      <table>
        <tr><th>时间</th><th>抽奖结果</th><th>已选</th></tr>
        ${recent.map(r=>`
          <tr>
            <td>${(r.time||'').replace('T',' ').slice(0,19)}</td>
            <td>${(r.results||[]).map(p=>p.emoji+p.name).join(' | ')}</td>
            <td>${r.picked?`<span class="picked-badge">✅ ${r.picked.emoji} ${r.picked.name}</span>`:'<span style="color:#aaa">未选</span>'}</td>
          </tr>
        `).join('')}
      </table>
    </div>`;
  document.getElementById('loading').style.display = 'none';
  document.getElementById('content').style.display = 'block';
}

loadData();
setInterval(loadData, 30000);
</script>
</body>
</html>
